    <script>
      (() => {
        try {
          const stored = localStorage.getItem('scaffold_arena_theme')
          const storedTextScale = localStorage.getItem('scaffold_arena_text_scale')
          if (
            storedTextScale === 'comfortable' ||
            storedTextScale === 'standard' ||
            storedTextScale === 'dense'
          ) {
            document.documentElement.setAttribute('data-text-scale', storedTextScale)
          } else {
            document.documentElement.setAttribute('data-text-scale', 'comfortable')
          }
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored)
            return
          }
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light')
        } catch {
          document.documentElement.setAttribute('data-text-scale', 'comfortable')
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
