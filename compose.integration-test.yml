name: scaffold-arena-production-integrations

services:
  postgres:
    image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_DB: arena_integration
      POSTGRES_USER: arena_integration_runner
      POSTGRES_PASSWORD: arena_integration_local_only
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena_integration_runner -d arena_integration"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres-integration-data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: arena_integration_access
      MINIO_ROOT_PASSWORD: arena_integration_secret_local_only
      MC_HOST_local: http://arena_integration_access:arena_integration_secret_local_only@127.0.0.1:9000
    ports:
      - "127.0.0.1:${MINIO_TEST_PORT:-59000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    volumes:
      - minio-integration-data:/data

volumes:
  postgres-integration-data:
  minio-integration-data:
