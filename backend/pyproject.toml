[project]
name = "scaffold-arena-backend"
version = "0.9.1"
description = "Scaffold Arena - Scaffold Engineering Workbench backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",
    "sse-starlette>=2.2.0",
    "anthropic>=0.43.0",
    "openai>=1.0.0",
    "jsonschema>=4.23.0",
    "rapidfuzz>=3.11.0",
    "orjson>=3.10.0",
    "httpx>=0.28.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "Authlib>=1.3.2",
    "joserfc>=1.7.0,<2",
]

[project.scripts]
arena = "arena_cli.entrypoint:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests", "tests.*", "build", "build.*", "dist", "dist.*"]

[tool.setuptools.package-data]
"adapters_v1.offline_fixture" = [
    "study_pack/*.json",
    "study_pack/*.md",
    "study_pack/fixtures/*.json",
    "study_pack/fixtures/*.md",
    "study_pack/fixtures/contracts/*.json",
    "study_pack/fixtures/outputs/*.json",
    "study_pack/fixtures/reference-solutions/*.json",
    "study_pack/fixtures/sources/*.json",
]
"genome_v1" = ["data/*.json", "fixtures/*.json", "fixtures/*.md"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=5.0.0",
]
pdf = [
    "weasyprint>=70.0",
    "pillow>=12.3.0",
    "markdown>=3.7",
]
team = [
    "psycopg[binary]>=3.2.0",
    "boto3>=1.35.0",
]
research = [
    "statsmodels>=0.14.0",
    "pyarrow>=18.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["integration: requires an externally provisioned integration service"]
